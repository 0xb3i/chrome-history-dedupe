<!doctype html>
<html class="popup-root" lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deduped History Search</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="popup-body minimal-mode">
    <main class="popup shell">
      <div class="launcher-bar">
        <form class="controls popup-controls launcher-search" id="search-form">
          <label class="field">
            <span class="visually-hidden">搜索历史记录</span>
            <input id="query" type="search" placeholder="搜索标题或曾用名" aria-describedby="search-keyboard-hint" autocomplete="off" autofocus>
          </label>
        </form>
        <p id="search-keyboard-hint" class="visually-hidden">输入后自动搜索。按向下箭头选择结果，回车打开，Esc 返回搜索框，⌘K 或 Ctrl+K 打开当前网页的操作。</p>

        <div class="filter-bar" role="group" aria-label="筛选历史记录">
          <label class="field range-control">
            <span class="visually-hidden">时间筛选</span>
            <select id="range">
              <option value="day">24 小时</option>
              <option value="week" selected>7 天</option>
              <option value="month">30 天</option>
              <option value="quarter">90 天</option>
              <option value="all">全部时间</option>
            </select>
          </label>
          <button class="view-options-trigger" id="view-options" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="view-options-panel" title="筛选与排序">
            <span class="visually-hidden">筛选与排序</span>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2.5 5h6M12.5 5h1M2.5 11h1M7.5 11h6"/><circle cx="10.5" cy="5" r="1.75"/><circle cx="5.5" cy="11" r="1.75"/></svg>
          </button>
          <div class="view-options-panel" id="view-options-panel" role="group" aria-label="筛选与排序" hidden>
            <label class="rename-filter">
              <span>仅显示已命名</span>
              <input id="renamed-only" type="checkbox" role="switch">
            </label>
            <div class="view-option-row">
              <span class="view-option-label" aria-hidden="true">排序</span>
              <div class="result-controls" id="result-controls" aria-label="排序方式"></div>
            </div>
            <hr class="view-options-separator">
            <button class="view-option-action" id="open-settings" type="button"><span class="view-option-action-label">设置…</span></button>
          </div>
        </div>
      </div>

      <div class="status-line visually-hidden">
        <span id="status-pill" role="status">待搜索</span>
      </div>

      <div class="popup-result-scroll" tabindex="-1" aria-label="搜索结果列表">
        <ol class="results popup-results" id="results"></ol>
        <section class="empty-state" id="empty-state">输入关键词或直接搜索最近历史。</section>
      </div>
      <footer class="launcher-footer">
        <section class="summary" id="summary" aria-label="搜索结果数量">
          <span class="result-count" role="status">正在读取历史记录…</span>
        </section>
        <span class="key-hint" id="primary-key-hint" aria-hidden="true"><span class="key-hint-label">选择</span><kbd>↓</kbd></span>
        <span class="key-hint-divider" aria-hidden="true"></span>
        <span class="key-hint" aria-hidden="true"><span class="key-hint-label">操作</span><kbd data-mod-key>⌘</kbd><kbd>K</kbd></span>
      </footer>
      <div class="actions-panel" id="actions-panel" role="menu" aria-label="网页操作" hidden>
        <div class="actions-panel-head">
          <button class="actions-panel-back" id="actions-back" type="button" aria-label="返回操作列表" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M10 3 5 8l5 5"/></svg></button>
          <span class="actions-panel-title" id="actions-title"></span>
        </div>
        <div class="actions-panel-list" id="actions-list"></div>
      </div>
    </main>

    <script type="module" src="src/history-page.js"></script>
  </body>
</html>

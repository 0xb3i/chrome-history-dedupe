<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>历史记录去重搜索 · 设置</title>
    <link rel="icon" type="image/png" sizes="16x16" href="icons/cat-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/cat-32.png">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="settings-body">
    <main class="settings">
      <header class="settings-header">
        <img src="icons/cat-128.png" width="48" height="48" alt="">
        <div>
          <h1>历史记录去重搜索</h1>
          <p class="settings-version" id="app-version"></p>
        </div>
      </header>

      <section class="settings-group" aria-labelledby="backup-heading">
        <h2 id="backup-heading">备份与恢复</h2>
        <div class="settings-card">
          <div class="settings-row">
            <div>
              <p class="settings-row-title">导出或恢复</p>
              <p class="settings-row-detail">包含重命名、来源名称、置顶和自动采集的标题。</p>
            </div>
            <div class="user-data-controls" id="user-data-controls" role="group" aria-label="备份与恢复">
              <button class="secondary-button" id="export-user-data" type="button">导出…</button>
              <button class="secondary-button" id="import-user-data" type="button">恢复…</button>
              <input id="user-data-file" type="file" accept=".json,application/json" aria-label="选择备份文件" hidden>
            </div>
          </div>
          <p class="user-data-status" id="user-data-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </div>
        <p class="settings-note">恢复时保留现有名称。备份不包含 Chrome 原始历史记录。</p>
      </section>

      <section class="settings-group" aria-labelledby="appearance-heading">
        <h2 id="appearance-heading">外观</h2>
        <div class="settings-card">
          <label class="settings-row">
            <span class="settings-row-title">主题色</span>
            <select id="theme-color" class="settings-select">
              <option value="blue" selected>蓝色</option>
              <option value="orange">暖橙</option>
              <option value="green">绿色</option>
              <option value="neutral">中性</option>
            </select>
          </label>
        </div>
      </section>

      <section class="settings-group" aria-labelledby="shortcut-heading">
        <h2 id="shortcut-heading">快捷键</h2>
        <div class="settings-card">
          <div class="settings-row settings-shortcut-row">
            <p class="settings-row-title" id="search-shortcut-label">打开搜索</p>
            <p class="settings-row-detail settings-shortcut-value" data-shortcut-command="_execute_action" role="status" aria-labelledby="search-shortcut-label">正在读取…</p>
          </div>
          <div class="settings-row settings-shortcut-row">
            <p class="settings-row-title" id="rename-shortcut-label">重命名当前网页</p>
            <p class="settings-row-detail settings-shortcut-value" data-shortcut-command="rename-current-page" role="status" aria-labelledby="rename-shortcut-label">正在读取…</p>
          </div>
          <div class="settings-card-actions">
            <button class="secondary-button" id="shortcut-settings" type="button">在 Chrome 中修改快捷键</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="src/settings-page.js"></script>
  </body>
</html>

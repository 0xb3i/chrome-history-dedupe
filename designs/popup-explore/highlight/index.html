<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:18px;width:940px;box-sizing:border-box;background:#fbfbfb;font:14px/20px -apple-system,"PingFang SC";color:#1d1d1f;-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.c{background:#fbfbfb;border-radius:10px;padding:8px 6px;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.h{font:600 12px -apple-system;color:#6e6e73;padding:2px 10px 6px}
.r{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:8px}
.r.sel{background:rgba(0,0,0,.07)}
.i{width:20px;height:20px;border-radius:5px;flex:none}
.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:#6e6e73;font-size:12px;width:80px;flex:none}
/* A current */
.a mark{background:#ffe58a;color:inherit;border-radius:2px;padding:0 1px}
/* B macOS find: softer yellow, tight, slight underline */
.b mark{background:rgba(255,204,0,.28);color:inherit;border-radius:3px;padding:0 1px;box-shadow:inset 0 -1.5px 0 rgba(214,160,0,.55)}
/* C weight only */
.cc mark{background:none;color:#000;font-weight:600}
/* E weight + faint underline */
.e mark{background:none;color:#000;font-weight:600;text-decoration:underline;text-decoration-color:rgba(0,0,0,.28);text-decoration-thickness:1.5px;text-underline-offset:3px}
/* D Raycast-ish: bold + soft accent tint */
.d mark{background:rgba(0,122,255,.10);color:#0058d0;font-weight:500;border-radius:3px;padding:0 1px}
</style>
<script>
const rows=[['#3370ff','历史搜索弹窗 v3 <mark>设计</mark>稿 – Figma','figma.com'],['#3370ff','字节跳动内部 AI <mark>Tool</mark> 与平台导航','飞书云文档'],['#2b6bff','[US-TTP] Ecom Affiliate <mark>Tool</mark>s FaaS PPE 上线(分批)','Bits',1],['#111','RUC-NLPIR/FlashRAG: A Python <mark>tool</mark>kit for RAG','Github'],['#e9a23b','Text-Well - AI Writing <mark>Tool</mark> with Expert Review','text-well.com']];
const v=[['a','A 当前：实心黄'],['b','B 浅黄 + 底线'],['cc','C 仅加粗'],['d','D 浅蓝 + 主色字'],['e','E 加粗 + 淡下划线']];
document.write(v.map(([k,n])=>`<div class="c ${k}"><div class="h">${n}</div>${rows.map(([c,t,s,sel])=>`<div class="r${sel?' sel':''}"><span class="i" style="background:${c}"></span><span class="t">${t}</span><span class="s">${s}</span></div>`).join('')}</div>`).join(''));
</script>

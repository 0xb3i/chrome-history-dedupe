<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 聚光灯单列</title>
<style>
  :root {
    --bg: #fbfbfb;
    --text: #1d1d1f;
    --secondary: #737378;
    --tertiary: #9c9ca1;
    --hairline: rgba(0, 0, 0, 0.08);
    --selected: rgba(0, 0, 0, 0.07);
    --keycap: rgba(0, 0, 0, 0.06);
    --find: #ffe58a;
    --accent: #ff5f57;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e8e8ea; }
  body {
    font: 14px/20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    width: 580px;
    height: 560px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  /* Search bar: the query is the hero, one filter pop-up on the right. */
  .search {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 12px 0 18px;
    border-bottom: 1px solid var(--hairline);
  }
  .search svg { flex: 0 0 18px; color: var(--tertiary); }
  .query {
    flex: 1;
    font-size: 18px;
    line-height: 24px;
    letter-spacing: -0.01em;
  }
  .caret {
    display: inline-block;
    width: 1.5px;
    height: 21px;
    margin-left: 1px;
    vertical-align: -4px;
    background: var(--text);
  }
  .popup-button {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 8px 0 10px;
    border-radius: 6px;
    background: #fff;
    box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 1px 1px rgba(0, 0, 0, 0.05);
    color: var(--text);
    font-size: 13px;
  }
  .popup-button svg { color: var(--tertiary); }

  .list { flex: 1; overflow: hidden; padding: 4px 8px 0; }
  .section {
    padding: 10px 10px 4px;
    color: var(--secondary);
    font-size: 12px;
    font-weight: 600;
    line-height: 16px;
  }
  .row {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 10px;
    border-radius: 8px;
  }
  .row.selected { background: var(--selected); }
  .favicon {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    object-fit: cover;
  }
  .favicon.letter {
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
  }
  .title-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .host {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    color: var(--tertiary);
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  mark { background: var(--find); color: inherit; border-radius: 2px; padding: 0 1px; }
  .accessories {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--tertiary);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .accessories svg { width: 12px; height: 12px; }
  .tag {
    padding: 0 6px;
    border-radius: 4px;
    background: var(--keycap);
    color: var(--secondary);
    font-size: 11px;
    line-height: 18px;
  }
  .pin { color: var(--secondary); }

  /* Action bar, as Raycast's footer: context left, primary + menu right. */
  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 40px;
    padding: 0 10px 0 16px;
    border-top: 1px solid var(--hairline);
    color: var(--secondary);
    font-size: 12px;
  }
  .actions .context { display: flex; align-items: center; gap: 8px; margin-right: auto; }
  .actions .app-icon { width: 16px; height: 16px; }
  .actions .primary { color: var(--text); font-weight: 500; }
  .actions .divider { width: 1px; height: 14px; background: var(--hairline); }
  kbd {
    display: inline-grid;
    place-items: center;
    min-width: 20px;
    height: 20px;
    padding: 0 4px;
    border-radius: 4px;
    background: var(--keycap);
    color: var(--secondary);
    font: 500 11px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  }
</style>
</head>
